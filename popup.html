<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WhatsApp Voice Transcriber</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 250px;
      margin: 0;
      padding: 16px;
      background-color: #111b21;
      color: #e9edef;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon {
      color: #00a884;
    }
    p {
      font-size: 13px;
      color: #8696a0;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #d1d7db;
    }
    select {
      width: 100%;
      padding: 8px;
      background-color: #202c33;
      border: 1px solid #2a3942;
      color: #e9edef;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 14px;
      outline: none;
    }
    select:focus {
      border-color: #00a884;
    }
    button {
      width: 100%;
      background-color: #00a884;
      color: #111b21;
      border: none;
      padding: 10px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #008f6f;
    }
    .error {
      color: #f15c6d;
      font-size: 12px;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <h3>
    <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
      <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"></path>
    </svg>
    Export Chat
  </h3>
  <p>Export the active chat's messages for today, including local voice transcriptions.</p>
  
  <label for="format">Format:</label>
  <select id="format">
    <option value="txt">Plain Text (.txt)</option>
    <option value="csv">Spreadsheet (.csv)</option>
    <option value="json">Raw Data (.json)</option>
  </select>
  
  <button id="export-btn">Export Today's Chat</button>
  <div id="error-msg" class="error">Please open a WhatsApp Web chat first.</div>

  <script src="popup.js"></script>
</body>
</html>
